archivesBaseName = 'fetchplan-jmix'

dependencies {
    implementation 'io.jmix.core:jmix-core-starter'
    implementation 'io.jmix.data:jmix-eclipselink-starter'
    implementation 'com.github.javaparser:javaparser-core:3.27.0'
    implementation 'com.github.javaparser:javaparser-symbol-solver-core:3.27.0'

    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
    }
    testImplementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation project(':fetchplan-jmix-test-scenarios')

    testRuntimeOnly 'org.hsqldb:hsqldb'
}

test {
    useJUnitPlatform()
}

rootProject.tasks.register('fetchplanAnalyzeMethod', JavaExec) {
    group = 'verification'
    description = 'Renders a single-method Jmix fetch-plan analysis report as JSON or Markdown.'

    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.github.reloadall.fetchplan.analyzer.jmix.report.SingleMethodAnalysisReportCli'

    doFirst {
        args = [
                "fetchplan.className=${findProperty('fetchplan.className') ?: ''}",
                "fetchplan.methodName=${findProperty('fetchplan.methodName') ?: ''}",
                "fetchplan.rootParam=${findProperty('fetchplan.rootParam') ?: ''}",
                "fetchplan.rootType=${findProperty('fetchplan.rootType') ?: ''}",
                "fetchplan.format=${findProperty('fetchplan.format') ?: 'json'}",
                "fetchplan.output=${findProperty('fetchplan.output') ?: ''}"
        ]
    }
}
